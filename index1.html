<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid black;
            background: #eee;
        }

        #score {
            font-size: 24px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>贪吃蛇</h1>
    <div id="score">分数：0</div>

    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // 每个格子的大小
        const size = 20;

        // 蛇
        let snake = [
            { x: 200, y: 200 },
            { x: 180, y: 200 },
            { x: 160, y: 200 }
        ];

        // 移动方向
        let dx = size;
        let dy = 0;

        // 食物
        let food = {
            x: Math.floor(Math.random() * 20) * size,
            y: Math.floor(Math.random() * 20) * size
        };

        let score = 0;

        // 键盘控制
        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp" && dy === 0) {
                dx = 0;
                dy = -size;
            }

            if (event.key === "ArrowDown" && dy === 0) {
                dx = 0;
                dy = size;
            }

            if (event.key === "ArrowLeft" && dx === 0) {
                dx = -size;
                dy = 0;
            }

            if (event.key === "ArrowRight" && dx === 0) {
                dx = size;
                dy = 0;
            }
        });

        // 游戏循环
        function gameLoop() {

            // 计算蛇头的新位置
            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            // 撞墙
            if (
                head.x < 0 ||
                head.x >= canvas.width ||
                head.y < 0 ||
                head.y >= canvas.height
            ) {
                gameOver();
                return;
            }

            // 撞到自己
            for (let i = 0; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    gameOver();
                    return;
                }
            }

            // 把新头放进去
            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {

                score++;
                document.getElementById("score").textContent =
                    "分数：" + score;

                // 生成新的食物
                food = {
                    x: Math.floor(Math.random() * 20) * size,
                    y: Math.floor(Math.random() * 20) * size
                };

            } else {
                // 没吃到食物，就删除尾巴
                snake.pop();
            }

            draw();

            setTimeout(gameLoop, 100);
        }

        // 绘制
        function draw() {

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画蛇
            ctx.fillStyle = "green";

            for (let part of snake) {
                ctx.fillRect(
                    part.x,
                    part.y,
                    size,
                    size
                );
            }

            // 画食物
            ctx.fillStyle = "red";

            ctx.fillRect(
                food.x,
                food.y,
                size,
                size
            );
        }

        // 游戏结束
        function gameOver() {
            alert("游戏结束！你的分数是：" + score);
            location.reload();
        }

        // 开始游戏
        gameLoop();
    </script>

</body>
</html>
